version: '3.8'

services:
  # PHP Apache Web Server
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance_web
    ports:
      - "80:80"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=${DB_PASS:-rootpassword}
      - DB_NAME=attendance_system
    depends_on:
      db:
        condition: service_healthy
    networks:
      - attendance_network
    restart: unless-stopped

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: attendance_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: attendance_system
      MYSQL_USER: ${MYSQL_USER:-attendance_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-attendance_pass}
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql
    networks:
      - attendance_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      timeout: 5s
      retries: 10
      interval: 5s

  # PhpMyAdmin (Optional - for database management)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: attendance_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    depends_on:
      - db
    networks:
      - attendance_network
    restart: unless-stopped

volumes:
  db_data:
    driver: local

networks:
  attendance_network:
    driver: bridge
