name: Deploy to EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup deployment environment
      run: |
        echo "🚀 Starting deployment process..."
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo "Triggered by: ${{ github.actor }}"

    - name: Deploy to EC2
      env:
        PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
      run: |
        echo "🔑 Setting up SSH key..."
        echo "$PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem
        
        echo "📦 Copying files to EC2..."
        scp -o StrictHostKeyChecking=no -i private_key.pem -r ./* ${USER}@${HOST}:~/attendance-app/
        echo "✅ Files copied successfully"
        
        echo "🔧 Deploying application on EC2..."
        ssh -o StrictHostKeyChecking=no -i private_key.pem ${USER}@${HOST} << 'EOF'
          cd ~/attendance-app
          
          echo "📊 Current containers before deployment:"
          docker ps -a --filter "name=attendance"
          
          echo "⬇️ Stopping and removing current containers..."
          docker-compose -f docker-compose.prod.yml down -v --remove-orphans
          
          echo "🗑️ Removing old images to force fresh build..."
          docker images | grep attendance | awk '{print $3}' | xargs -r docker rmi -f || true
          
          echo "📥 Pulling base images..."
          docker-compose -f docker-compose.prod.yml pull
          
          echo "🏗️ Building images without cache (force rebuild)..."
          docker-compose -f docker-compose.prod.yml build --no-cache --pull
          
          echo "🚀 Starting containers..."
          docker-compose -f docker-compose.prod.yml up -d --force-recreate
          
          echo "⏳ Waiting for containers to be healthy..."
          sleep 10
          
          echo "🧹 Cleaning up dangling images..."
          docker image prune -f
          
          echo "📊 New Container Status:"
          docker-compose -f docker-compose.prod.yml ps
          docker ps --filter "name=attendance" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.Image}}"
          
          echo "🔍 Checking web container logs (last 20 lines):"
          docker logs attendance_web --tail 20 || true
          
          echo "✅ Deployment completed successfully!"
          echo "Timestamp: $(date)"
        EOF
        
        rm -f private_key.pem
        echo "🎉 Deployment process finished!"
    
    - name: Verify deployment
      if: success()
      env:
        PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
      run: |
        echo "🔍 Verifying deployment..."
        echo "$PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem
        
        ssh -o StrictHostKeyChecking=no -i private_key.pem ${USER}@${HOST} << 'EOF'
          cd ~/attendance-app
          
          echo "✅ Running containers:"
          docker ps --filter "name=attendance" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          
          echo ""
          echo "📋 Image details:"
          docker images | grep attendance
          
          echo ""
          echo "🏥 Health check:"
          docker inspect attendance_db --format='{{.State.Health.Status}}' || echo "No health check configured"
          
          echo ""
          echo "📁 Application files timestamp:"
          ls -lah ~/attendance-app/*.php | head -5
        EOF
        
        rm -f private_key.pem
        echo "✅ Verification complete!"
    
    - name: Deployment Summary
      if: always()
      run: |
        echo "================================================"
        echo "📋 DEPLOYMENT SUMMARY"
        echo "================================================"
        echo "Status: ${{ job.status }}"
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo "Actor: ${{ github.actor }}"
        echo "Time: $(date)"
        echo "================================================"
