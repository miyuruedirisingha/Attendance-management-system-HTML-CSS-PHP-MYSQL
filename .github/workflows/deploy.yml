name: Deploy to EC2 with Docker

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to EC2
      env:
        PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
      run: |
        echo "🔑 Setting up SSH..."
        echo "$PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem

        echo "📦 Syncing files to EC2..."
        rsync -avz --delete \
          -e "ssh -o StrictHostKeyChecking=no -i private_key.pem" \
          --exclude '.git' \
          --exclude '.github' \
          --exclude '.env' \
          ./ ${USER}@${HOST}:~/attendance-app/

        echo "🚀 Deploying with Docker on EC2..."
        ssh -o StrictHostKeyChecking=no -i private_key.pem ${USER}@${HOST} << 'ENDSSH'
          set -e
          cd ~/attendance-app

          echo "📝 Preparing environment..."
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          echo "⬇️ Stopping old containers..."
          docker-compose -f docker-compose.prod.yml down

          echo "🏗️ Rebuilding and starting containers..."
          docker-compose -f docker-compose.prod.yml up -d \
            --build \
            --force-recreate \
            --remove-orphans

          echo "⏳ Waiting for services..."
          sleep 10

          echo "🔍 Container status:"
          docker-compose -f docker-compose.prod.yml ps

          echo "🧹 Cleaning unused images..."
          docker image prune -f

          echo "✅ Deployment successful!"
        ENDSSH

        rm -f private_key.pem
        echo "🎉 Deployment complete!"

    - name: Deployment notification
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment succeeded!"
        else
          echo "❌ Deployment failed!"
        fi
       