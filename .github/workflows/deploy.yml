name: Deploy to EC2 (Docker CI/CD)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Sync project to EC2
        run: |
          echo "📤 Syncing files to EC2..."
          rsync -avz --delete \
            --exclude='.git' \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/attendance-app
          echo "✅ Sync completed"
          
      - name: Verify files on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            echo "📂 Checking synced files..."
            ls -lah /home/ubuntu/attendance-app/css/style.css
            head -15 /home/ubuntu/attendance-app/css/style.css
            echo "---"
            ls -lah /home/ubuntu/attendance-app/Dockerfile
          EOF

      - name: Deploy on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e  # Exit on any error
            cd /home/ubuntu/attendance-app

            echo "📋 Current directory: $(pwd)"
            echo "📂 Files present: $(ls -la | head -10)"
            echo ""
            echo "📄 Checking CSS file on disk..."
            head -15 css/style.css
            echo ""
            
            echo "🔍 Checking current images..."
            docker images | grep attendance || echo "No attendance images found"
            OLD_WEB_IMAGE=$(docker images attendance-app_web --format "{{.ID}}" | head -1 || echo "none")
            echo "Old web image ID: $OLD_WEB_IMAGE"

            echo "🛑 Stopping and removing old containers..."
            docker-compose down --remove-orphans --volumes || true
            
            echo "🧹 Force stop and remove ALL attendance containers..."
            docker stop attendance_db attendance_web attendance_phpmyadmin || true
            docker rm -f attendance_db attendance_web attendance_phpmyadmin || true
            
            echo "🗑️ Removing ALL old attendance images..."
            docker rmi -f $(docker images | grep attendance | awk '{print $3}') || true
            docker image prune -af || true

            echo "🧹 Clean Docker system..."
            docker system prune -f || true

            echo "🧼 Pruning unused images..."
            docker image prune -af

            echo "🏗️ Rebuilding images with no cache..."
            docker-compose build --no-cache --pull
            
            echo "🔍 Verifying new images were created..."
            NEW_WEB_IMAGE=$(docker images attendance-app_web --format "{{.ID}}" | head -1)
            echo "New web image ID: $NEW_WEB_IMAGE"
            
            if [ -z "$NEW_WEB_IMAGE" ]; then
              echo "❌ ERROR: New image was not created!"
              exit 1
            fi
            
            if [ "$OLD_WEB_IMAGE" = "$NEW_WEB_IMAGE" ] && [ "$OLD_WEB_IMAGE" != "none" ]; then
              echo "⚠️  WARNING: Image ID didn't change! Rebuild may have failed!"
              exit 1
            fi

            echo "🚀 Starting containers with force recreate..."
            docker-compose up -d --force-recreate --remove-orphans

            echo "⏳ Waiting for containers to be healthy..."
            sleep 10
            
            echo "🔍 Verify files inside new container..."
            echo "=== CSS file (first 20 lines) ==="
            docker exec attendance_web cat /var/www/html/css/style.css | head -20
            echo "=== Build info ==="
            docker exec attendance_web cat /var/www/html/.build-info.php || echo "Build info not found"
            echo "=== Git commit in container ==="
            docker exec attendance_web bash -c "cd /var/www/html && git log --oneline -1" || echo "Git not available in container"
            
            echo "🧹 Clear all caches in container..."
            docker exec attendance_web bash -c "rm -rf /tmp/* /var/cache/apache2/* || true"
            docker exec attendance_web apachectl -k graceful || true

            echo "🔍 Container status:"
            docker-compose ps
            
            echo "🔍 Verify running containers are using new image..."
            RUNNING_IMAGE=$(docker inspect attendance_web --format='{{.Image}}' | cut -c8-19)
            echo "Running container image: $RUNNING_IMAGE"
            echo "Built image: $NEW_WEB_IMAGE"

            echo "📊 Checking web container logs..."
            docker logs attendance_web --tail=20 || true
            
            echo "🔄 Restarting Apache to clear PHP opcache..."
            docker exec attendance_web apachectl graceful || true

            echo "✅ Deployment completed successfully!"
            echo "New image: $NEW_WEB_IMAGE"
            echo "🌐 Clear browser cache (Ctrl+F5) to see CSS changes"
          EOF
