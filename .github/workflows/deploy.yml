name: Deploy to EC2 (Docker CI/CD)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Sync project to EC2
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/attendance-app

      - name: Deploy on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd /home/ubuntu/attendance-app

            echo "🛑 Stopping and removing old containers..."
            docker compose down --remove-orphans || true

            echo "🧹 Force removing old DB container if exists..."
            docker rm -f attendance_db || true

            echo "🧼 Cleaning unused images..."
            docker image prune -af

            echo "🏗️ Rebuilding images (no cache)..."
            docker compose build --no-cache

            echo "🚀 Starting containers..."
            docker compose up -d

            echo "✅ Deployment completed!"
          EOF
